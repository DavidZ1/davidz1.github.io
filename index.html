<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DavidZ1's Pages</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f4f0;
      --surface:   #ffffff;
      --border:    rgba(0,0,0,0.08);
      --border-md: rgba(0,0,0,0.14);
      --text:      #1a1a18;
      --muted:     #6b6b67;
      --hint:      #a5a5a0;
      --radius-md: 8px;
      --radius-lg: 14px;
      --accent1: #7F77DD;
      --accent2: #1D9E75;
      --accent3: #D85A30;
      --accent4: #378ADD;
      --accent5: #D4537E;
      --accent6: #639922;
      --accent7: #BA7517;
      --accent8: #A32D2D;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #181816;
        --surface: #222220;
        --border:  rgba(255,255,255,0.08);
        --border-md: rgba(255,255,255,0.14);
        --text:    #eeeee8;
        --muted:   #9a9a94;
        --hint:    #606060;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Layout ── */
    #app { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

    /* ── Header ── */
    .header { margin-bottom: 2.75rem; }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .header h1 span { color: var(--muted); font-weight: 400; }
    .subtitle { font-size: 14px; color: var(--muted); }

    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 7px 14px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .refresh-btn:hover { background: var(--bg); color: var(--text); }
    .refresh-btn svg { flex-shrink: 0; }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap svg {
      position: absolute;
      left: 11px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.35;
    }
    .search-wrap input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      font-size: 14px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-wrap input:focus { border-color: var(--accent4); }
    .search-wrap input::placeholder { color: var(--hint); }

    .sort-group { display: flex; gap: 6px; }
    .sort-btn {
      font-size: 13px;
      padding: 7px 14px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .sort-btn:hover { background: var(--bg); color: var(--text); }
    .sort-btn.active {
      background: var(--bg);
      color: var(--text);
      border-color: var(--border-md);
      font-weight: 500;
    }

    .count { font-size: 13px; color: var(--hint); margin-bottom: 1.1rem; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.1rem 1.2rem 1rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.12s;
    }
    .card:hover {
      border-color: var(--border-md);
      transform: translateY(-2px);
    }
    .card-accent {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .card-body { display: flex; align-items: flex-start; gap: 11px; margin-top: 4px; }
    .card-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .card-info { flex: 1; min-width: 0; }
    .card-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
      margin-bottom: 3px;
    }
    .card-path {
      font-size: 11.5px;
      color: var(--hint);
      font-family: 'SFMono-Regular', Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 9px;
      border-top: 0.5px solid var(--border);
      font-size: 12px;
      color: var(--hint);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 99px;
      border: 0.5px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .arrow {
      font-size: 13px;
      color: var(--hint);
      transition: color 0.15s;
    }
    .card:hover .arrow { color: var(--muted); }

    /* ── States ── */
    .state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
      font-size: 14px;
      grid-column: 1 / -1;
    }
    .spinner {
      width: 26px; height: 26px;
      border: 2px solid var(--border-md);
      border-top-color: var(--muted);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 1.2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-icon { font-size: 28px; margin-bottom: .75rem; }

    /* ── Empty search ── */
    .empty { font-size: 14px; color: var(--muted); grid-column: 1/-1; padding: 2rem 0; text-align: center; }

    /* ── Footer ── */
    .footer {
      margin-top: 3.5rem;
      font-size: 12px;
      color: var(--hint);
      text-align: center;
    }
    .footer a { color: var(--hint); text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <h1>DavidZ1<span>'s Pages</span></h1>
      <button class="refresh-btn" id="refresh-btn" onclick="loadPages()" style="display:none">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M14 8A6 6 0 1 1 8 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8 2l2.5 2.5L8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Refresh
      </button>
    </div>
    <p class="subtitle" id="subtitle">Fetching from GitHub...</p>
  </div>

  <div class="controls" id="controls" style="display:none">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="search" placeholder="Search pages…" oninput="render()" autocomplete="off" />
    </div>
    <div class="sort-group">
      <button class="sort-btn active" id="sort-name" onclick="setSort('name')">Name</button>
      <button class="sort-btn" id="sort-path" onclick="setSort('path')">Path</button>
    </div>
  </div>

  <div class="count" id="count" style="display:none"></div>
  <div class="grid" id="grid">
    <div class="state"><div class="spinner"></div>Loading pages…</div>
  </div>

  <div class="footer" id="footer" style="display:none">
    Auto-generated index · <a href="https://github.com/DavidZ1/davidz1.github.io" target="_blank" rel="noopener">DavidZ1/davidz1.github.io</a>
  </div>
</div>

<script>
  const OWNER   = 'DavidZ1';
  const REPO    = 'davidz1.github.io';
  const BRANCH  = 'main';
  const BASE    = `https://${OWNER}.github.io`;
  const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

  const ACCENTS = ['#7F77DD','#1D9E75','#D85A30','#378ADD','#D4537E','#639922','#BA7517','#A32D2D'];

  const ICON_MAP = {
    index:'🏠', home:'🏠', about:'👤', contact:'✉️', project:'🔧',
    blog:'📝', post:'📝', demo:'▶️', game:'🎮', resume:'📄',
    portfolio:'💼', work:'💼', note:'📝', tool:'🔧', list:'📋',
    photo:'🖼️', gallery:'🖼️', video:'🎬', music:'🎵', link:'🔗',
    doc:'📄', read:'📖', faq:'❓', login:'🔑', search:'🔍',
  };

  let allPages = [];
  let sortMode = 'name';

  /* ── Helpers ── */
  function hashColor(str) {
    let h = 0;
    for (let c of str) h = Math.imul(31, h) + c.charCodeAt(0) | 0;
    return ACCENTS[Math.abs(h) % ACCENTS.length];
  }

  function getIcon(name) {
    const lc = name.toLowerCase().replace('.html','');
    for (const [k, v] of Object.entries(ICON_MAP)) {
      if (lc.includes(k)) return v;
    }
    return '📄';
  }

  function prettify(filename) {
    return filename
      .replace(/\.html$/i, '')
      .replace(/[-_]/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase())
      .trim() || filename;
  }

  function getSection(path) {
    const parts = path.split('/');
    return parts.length > 1 ? parts.slice(0, -1).join('/') : '';
  }

  function hex2rgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  /* ── Load ── */
  async function loadPages() {
    const grid = document.getElementById('grid');
    const subtitle = document.getElementById('subtitle');
    document.getElementById('controls').style.display = 'none';
    document.getElementById('count').style.display = 'none';
    document.getElementById('refresh-btn').style.display = 'none';
    document.getElementById('footer').style.display = 'none';
    subtitle.textContent = 'Fetching from GitHub…';
    grid.innerHTML = '<div class="state"><div class="spinner"></div>Loading pages…</div>';

    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const data = await res.json();

      allPages = (data.tree || [])
        .filter(f => f.type === 'blob' && /\.html?$/i.test(f.path))
        .map(f => {
          const parts = f.path.split('/');
          const filename = parts[parts.length - 1];
          const section  = getSection(f.path);
          const accent   = hashColor(f.path);
          return {
            path:    f.path,
            filename,
            label:   prettify(filename),
            section,
            url:     `${BASE}/${f.path}`,
            accent,
            icon:    getIcon(filename),
          };
        });

      subtitle.textContent = `${allPages.length} page${allPages.length !== 1 ? 's' : ''} · ${OWNER}/${REPO}`;
      document.getElementById('controls').style.display = 'flex';
      document.getElementById('count').style.display = 'block';
      document.getElementById('refresh-btn').style.display = 'inline-flex';
      document.getElementById('footer').style.display = 'block';
      render();
    } catch (err) {
      grid.innerHTML = `
        <div class="state">
          <div class="error-icon">⚠️</div>
          <strong>Could not load pages</strong><br>
          <small style="color:var(--hint);margin-top:6px;display:block">${err.message}</small>
        </div>`;
      subtitle.textContent = 'Failed to reach GitHub API';
    }
  }

  /* ── Sort ── */
  function setSort(mode) {
    sortMode = mode;
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('sort-' + mode).classList.add('active');
    render();
  }

  /* ── Render ── */
  function render() {
    const q = (document.getElementById('search')?.value || '').toLowerCase().trim();
    let pages = allPages.filter(p =>
      !q || p.label.toLowerCase().includes(q) || p.path.toLowerCase().includes(q)
    );

    if (sortMode === 'name') {
      pages.sort((a, b) => a.label.localeCompare(b.label));
    } else {
      pages.sort((a, b) => a.path.localeCompare(b.path));
    }

    const count = document.getElementById('count');
    count.textContent = q
      ? `${pages.length} of ${allPages.length} pages`
      : `${allPages.length} page${allPages.length !== 1 ? 's' : ''}`;

    const grid = document.getElementById('grid');
    if (!pages.length) {
      grid.innerHTML = '<div class="empty">No pages match your search.</div>';
      return;
    }

    grid.innerHTML = pages.map(p => `
      <a class="card" href="${escHtml(p.url)}" target="_blank" rel="noopener">
        <div class="card-accent" style="background:${p.accent}"></div>
        <div class="card-body">
          <div class="card-icon" style="background:${hex2rgba(p.accent, 0.12)}">${p.icon}</div>
          <div class="card-info">
            <div class="card-name">${escHtml(p.label)}</div>
            <div class="card-path">${escHtml(p.path)}</div>
          </div>
        </div>
        <div class="card-footer">
          <span class="badge">${escHtml(p.section || 'root')}</span>
          <span class="arrow">↗</span>
        </div>
      </a>
    `).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Boot ── */
  loadPages();
</script>
</body>
</html>
