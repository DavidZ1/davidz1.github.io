<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DavidZ1's Pages</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f4f3ef;
      --bg-tint:      #eceae3;
      --surface:      #ffffff;
      --surface-hover:#fbfaf6;
      --inset:        #f6f5f1;
      --border:       rgba(20,22,28,0.08);
      --border-md:    rgba(20,22,28,0.13);
      --border-strong:rgba(20,22,28,0.20);
      --text:         #191b1f;
      --muted:        #585d66;
      --hint:         #9a9ea7;
      --mono:         #4d525b;
      --radius:       9px;
      --radius-lg:    15px;
      --shadow:       0 1px 2px rgba(20,22,28,0.04), 0 8px 22px -12px rgba(20,22,28,0.10);
      --shadow-hover: 0 2px 4px rgba(20,22,28,0.05), 0 18px 40px -16px rgba(20,22,28,0.20);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
      --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #0d0e11;
        --bg-tint:      #14161b;
        --surface:      #16181d;
        --surface-hover:#1c1f26;
        --inset:        #101216;
        --border:       rgba(255,255,255,0.06);
        --border-md:    rgba(255,255,255,0.11);
        --border-strong:rgba(255,255,255,0.18);
        --text:         #e9eaee;
        --muted:        #969ba6;
        --hint:         #5b606b;
        --mono:         #b3b9c5;
        --shadow:       0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.6);
        --shadow-hover: 0 2px 6px rgba(0,0,0,0.45), 0 22px 48px -18px rgba(0,0,0,0.75);
      }
    }

    body {
      font-family: var(--font-sans);
      background:
        radial-gradient(900px 500px at 18% -8%, var(--bg-tint), transparent 70%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #app { max-width: 1120px; margin: 0 auto; padding: 3.4rem 1.5rem 5rem; }

    /* ── Header ── */
    .header { margin-bottom: 2.4rem; }
    .header-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 1rem;
      flex-wrap: wrap; margin-bottom: 14px;
    }
    .header h1 {
      font-size: 30px; font-weight: 650;
      letter-spacing: -0.9px; line-height: 1.05; color: var(--text);
    }
    .header h1 span { color: var(--hint); font-weight: 400; }

    /* mono status line — the "system" voice */
    .subtitle {
      display: inline-flex; align-items: center; flex-wrap: wrap;
      gap: 9px;
      font-family: var(--font-mono);
      font-size: 12px; letter-spacing: 0.02em;
      color: var(--muted);
    }
    .subtitle .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--hint); flex-shrink: 0; }
    .subtitle .host { color: var(--hint); }

    /* ── Top bar ── */
    .topbar {
      display: flex; gap: 10px; margin-bottom: 1.5rem;
      flex-wrap: wrap; align-items: center;
    }
    .search-wrap { position: relative; flex: 1; min-width: 220px; }
    .search-wrap svg {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%); pointer-events: none;
      color: var(--hint); transition: color 0.18s;
    }
    .search-wrap input {
      width: 100%; padding: 10px 14px 10px 38px;
      font-size: 14px; font-family: var(--font-sans);
      border: 1px solid var(--border-md);
      border-radius: var(--radius);
      background: var(--surface); color: var(--text);
      outline: none; box-shadow: var(--shadow);
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .search-wrap input:focus {
      border-color: var(--accent-focus, #7F77DD);
      box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--accent-focus, #7F77DD) 22%, transparent);
    }
    .search-wrap:focus-within svg { color: var(--accent-focus, #7F77DD); }
    .search-wrap input::placeholder { color: var(--hint); }

    .btn-group { display: inline-flex; gap: 0; box-shadow: var(--shadow); border-radius: var(--radius); }
    .btn-group button {
      font-size: 13px; font-weight: 500; padding: 9px 15px;
      display: inline-flex; align-items: center;
      border: 1px solid var(--border-md);
      background: var(--surface); color: var(--muted);
      cursor: pointer; transition: background 0.14s, color 0.14s, border-color 0.14s;
      white-space: nowrap;
    }
    .btn-group button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
    .btn-group button:last-child  { border-radius: 0 var(--radius) var(--radius) 0; border-left: none; }
    .btn-group button:hover { background: var(--surface-hover); color: var(--text); }
    .btn-group button.active {
      background: var(--text); color: var(--bg);
      border-color: var(--text);
    }
    .btn-group button:focus-visible { outline: 2px solid var(--accent-focus, #7F77DD); outline-offset: 2px; z-index: 1; }

    .icon-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 13px; font-weight: 500; padding: 8px 14px;
      border: 1px solid var(--border-md);
      border-radius: var(--radius);
      background: var(--surface); color: var(--muted);
      cursor: pointer; box-shadow: var(--shadow);
      transition: background 0.14s, color 0.14s;
      white-space: nowrap;
    }
    .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
    .icon-btn svg { transition: transform 0.5s ease; }
    .icon-btn:active svg { transform: rotate(-180deg); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent-focus, #7F77DD); outline-offset: 2px; }

    .count {
      font-family: var(--font-mono);
      font-size: 11.5px; letter-spacing: 0.03em;
      color: var(--hint); margin-bottom: 1.15rem;
      text-transform: lowercase;
    }

    /* ── animated container ── */
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    #main-content > * { animation: rise 0.34s cubic-bezier(.2,.7,.2,1) both; }

    /* ════════════════════════════ FOLDER VIEW ════════════════════════════ */
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .folder-card {
      --accent: #7F77DD;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 0.18s, transform 0.16s, box-shadow 0.18s;
      cursor: pointer;
    }
    /* book spine */
    .folder-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent);
      opacity: 0.55; transition: opacity 0.18s, box-shadow 0.18s;
    }
    .folder-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }
    .folder-card:hover::before,
    .folder-card.open::before {
      opacity: 1;
      box-shadow: 0 0 14px -1px var(--accent);
    }
    .folder-card.open { transform: none; }

    .folder-card-head {
      display: flex; align-items: center; gap: 13px;
      padding: 1rem 1.15rem 1rem 1.3rem;
    }
    .folder-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-weight: 700; font-size: 17px;
      letter-spacing: -0.5px; flex-shrink: 0;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .folder-label { flex: 1; min-width: 0; }
    .folder-name {
      font-size: 15.5px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: -0.2px;
    }
    .folder-sub {
      font-family: var(--font-mono);
      font-size: 11px; color: var(--hint); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .folder-sub .cnt { color: var(--muted); }

    .folder-arrow {
      font-size: 16px; color: var(--hint);
      transition: transform 0.24s ease, color 0.18s; flex-shrink: 0; line-height: 1;
    }
    .folder-card:hover .folder-arrow { color: var(--muted); }
    .folder-card.open .folder-arrow { transform: rotate(90deg); color: var(--accent); }

    .page-list {
      display: none;
      border-top: 1px solid var(--border);
      padding: 5px 0 6px;
      background: var(--inset);
    }
    .folder-card.open .page-list { display: block; animation: rise 0.22s ease both; }

    .page-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 1.15rem 8px 1.3rem;
      text-decoration: none; color: var(--muted);
      font-size: 13.5px;
      transition: background 0.13s, color 0.13s, padding-left 0.13s;
    }
    .page-item:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--text); padding-left: 1.5rem; }
    .page-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .page-item-icon { font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }
    .page-item-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-item-arrow { font-size: 12px; color: var(--hint); flex-shrink: 0; opacity: 0; transition: opacity 0.13s; }
    .page-item:hover .page-item-arrow { opacity: 1; }

    /* root files as chips */
    .root-section { margin-bottom: 1.6rem; }
    .root-label {
      font-family: var(--font-mono);
      font-size: 11px; color: var(--hint);
      text-transform: uppercase; letter-spacing: .12em;
      margin-bottom: 9px;
    }
    .root-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .root-chip {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 15px 7px 11px;
      border: 1px solid var(--border-md);
      border-radius: 99px;
      background: var(--surface); box-shadow: var(--shadow);
      text-decoration: none; color: var(--text);
      font-size: 13px; font-weight: 500;
      transition: background 0.14s, transform 0.14s, border-color 0.14s;
    }
    .root-chip:hover { background: var(--surface-hover); transform: translateY(-1px); border-color: var(--border-strong); }
    .root-chip:focus-visible { outline: 2px solid var(--accent-focus, #7F77DD); outline-offset: 2px; }

    /* ════════════════════════════ FLAT / ALL VIEW ════════════════════════════ */
    .flat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .flat-card {
      --accent: #7F77DD;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 1.1rem 1.2rem 1rem 1.3rem;
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column; gap: 12px;
      overflow: hidden;
      transition: border-color 0.18s, transform 0.16s, box-shadow 0.18s;
    }
    .flat-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent); opacity: 0.55;
      transition: opacity 0.18s, box-shadow 0.18s;
    }
    .flat-card:hover { border-color: var(--border-strong); transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    .flat-card:hover::before { opacity: 1; box-shadow: 0 0 14px -1px var(--accent); }
    .flat-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .flat-body { display: flex; align-items: flex-start; gap: 12px; }
    .flat-ico {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .flat-info { flex: 1; min-width: 0; }
    .flat-name {
      font-size: 15px; font-weight: 600; color: var(--text);
      line-height: 1.3; word-break: break-word; margin-bottom: 4px;
      letter-spacing: -0.2px;
    }
    .flat-path {
      font-size: 11.5px; color: var(--hint);
      font-family: var(--font-mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .flat-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 11px;
      border-top: 1px solid var(--border);
      font-size: 12px; color: var(--hint);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--font-mono); font-size: 11px;
      padding: 3px 10px; border-radius: 99px;
      background: color-mix(in srgb, var(--accent) 13%, transparent);
      color: var(--accent);
      max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .flat-footer .go { color: var(--hint); transition: color 0.14s, transform 0.14s; }
    .flat-card:hover .go { color: var(--accent); transform: translate(2px,-2px); }

    /* ── States ── */
    .state {
      text-align: center; padding: 4.5rem 1rem;
      color: var(--muted); font-size: 14px;
      grid-column: 1 / -1; line-height: 1.6;
    }
    .state strong { color: var(--text); font-size: 15px; }
    .spinner {
      width: 28px; height: 28px;
      border: 2.5px solid var(--border-md);
      border-top-color: #7F77DD;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1.2rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 3.6rem; padding-top: 1.6rem;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11.5px; letter-spacing: 0.02em;
      color: var(--hint); text-align: center;
    }
    .footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--border-md); padding-bottom: 1px; transition: color 0.14s, border-color 0.14s; }
    .footer a:hover { color: var(--text); border-color: var(--border-strong); }

    @media (max-width: 520px) {
      #app { padding: 2.2rem 1.1rem 4rem; }
      .header h1 { font-size: 25px; }
      .topbar { gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      .folder-card:hover, .flat-card:hover, .root-chip:hover { transform: none; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-top">
      <h1>DavidZ1<span>'s Pages</span></h1>
      <button class="icon-btn" id="refresh-btn" onclick="loadPages()" style="display:none">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M14 8A6 6 0 1 1 8 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8 2l2.5 2.5L8 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Refresh
      </button>
    </div>
    <p class="subtitle" id="subtitle">Fetching from GitHub…</p>
  </div>

  <div class="topbar" id="topbar" style="display:none">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
        <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="search" placeholder="Search pages…" oninput="onSearch()" autocomplete="off" />
    </div>
    <div class="btn-group">
      <button id="view-folder" class="active" onclick="setView('folder')" title="Group by folder">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:6px">
          <path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3.086a1.5 1.5 0 0 1 1.06.44L8.5 4.293A1.5 1.5 0 0 0 9.56 4.5H12.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7Z" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        Folders
      </button>
      <button id="view-all" onclick="setView('all')" title="Show all pages flat">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="vertical-align:-2px;margin-right:6px">
          <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
          <rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
          <rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
          <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        All Pages
      </button>
    </div>
    <div class="btn-group" id="sort-group" style="display:none">
      <button id="sort-name" class="active" onclick="setSort('name')">Name</button>
      <button id="sort-path" onclick="setSort('path')">Path</button>
    </div>
  </div>

  <div class="count" id="count" style="display:none"></div>
  <div id="main-content">
    <div class="folder-grid">
      <div class="state"><div class="spinner"></div>Loading pages…</div>
    </div>
  </div>

  <div class="footer" id="footer" style="display:none">
    auto-generated index · <a href="https://github.com/DavidZ1/davidz1.github.io" target="_blank" rel="noopener">DavidZ1/davidz1.github.io</a>
  </div>
</div>

<script>
  const OWNER  = 'DavidZ1';
  const REPO   = 'davidz1.github.io';
  const BRANCH = 'main';
  const BASE   = `https://${OWNER}.github.io`;
  const API    = `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

  const ACCENTS = ['#7F77DD','#1D9E75','#D85A30','#378ADD','#D4537E','#639922','#BA7517','#A32D2D'];

  const ICON_MAP = {
    index:'🏠', home:'🏠', about:'👤', contact:'✉️', project:'🔧',
    blog:'📝', post:'📝', demo:'▶️', game:'🎮', resume:'📄',
    portfolio:'💼', work:'💼', note:'📝', tool:'🔧', list:'📋',
    photo:'🖼️', gallery:'🖼️', video:'🎬', music:'🎵', link:'🔗',
    doc:'📄', read:'📖', faq:'❓', login:'🔑', search:'🔍',
  };

  let allPages = [];
  let currentView = 'folder';
  let sortMode = 'name';

  function hashColor(str) {
    let h = 0;
    for (let c of str) h = Math.imul(31, h) + c.charCodeAt(0) | 0;
    return ACCENTS[Math.abs(h) % ACCENTS.length];
  }
  function getIcon(name) {
    const lc = name.toLowerCase().replace(/\.html?$/i, '');
    for (const [k, v] of Object.entries(ICON_MAP)) { if (lc.includes(k)) return v; }
    return '📄';
  }
  function prettify(fn) {
    return fn.replace(/\.html?$/i,'').replace(/[-_]/g,' ')
      .replace(/\b\w/g, c => c.toUpperCase()).trim() || fn;
  }
  function monogram(name) {
    const m = String(name).replace(/[^a-zA-Z0-9]/g,'');
    return (m.charAt(0) || '#').toUpperCase();
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function loadPages() {
    const content  = document.getElementById('main-content');
    const subtitle = document.getElementById('subtitle');
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('count').style.display = 'none';
    document.getElementById('refresh-btn').style.display = 'none';
    document.getElementById('footer').style.display = 'none';
    subtitle.textContent = 'Fetching from GitHub…';
    content.innerHTML = '<div class="folder-grid"><div class="state"><div class="spinner"></div>Loading pages…</div></div>';

    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const data = await res.json();

      allPages = (data.tree || [])
        .filter(f => f.type === 'blob' && /\.html?$/i.test(f.path))
        .map(f => {
          const parts = f.path.split('/');
          const filename = parts[parts.length - 1];
          const folder = parts.length > 1 ? parts.slice(0,-1).join('/') : '';
          const accent = hashColor(f.path);
          return { path: f.path, filename, label: prettify(filename),
                   folder, url: `${BASE}/${f.path}`, accent, icon: getIcon(filename) };
        });

      const topFolders = new Set(allPages.filter(p => p.folder).map(p => p.folder.split('/')[0]));
      const n = allPages.length;
      subtitle.innerHTML =
        `${n} page${n !== 1 ? 's' : ''}<span class="dot"></span>` +
        `${topFolders.size} folder${topFolders.size !== 1 ? 's' : ''}<span class="dot"></span>` +
        `<span class="host">${esc(REPO)}</span>`;

      document.getElementById('topbar').style.display = 'flex';
      document.getElementById('count').style.display = 'block';
      document.getElementById('refresh-btn').style.display = 'inline-flex';
      document.getElementById('footer').style.display = 'block';
      render();
    } catch(err) {
      content.innerHTML = `<div class="folder-grid"><div class="state">
        <div style="font-size:30px;margin-bottom:.8rem">⚠️</div>
        <strong>Couldn't reach GitHub</strong><br>
        <small style="color:var(--hint);margin-top:8px;display:block">${esc(err.message)} — try Refresh in a moment.</small>
      </div></div>`;
      subtitle.textContent = 'Failed to reach GitHub API';
    }
  }

  function setView(v) {
    currentView = v;
    document.getElementById('view-folder').classList.toggle('active', v === 'folder');
    document.getElementById('view-all').classList.toggle('active', v === 'all');
    document.getElementById('sort-group').style.display = v === 'all' ? 'inline-flex' : 'none';
    document.getElementById('search').value = '';
    render();
  }

  function setSort(s) {
    sortMode = s;
    document.getElementById('sort-name').classList.toggle('active', s === 'name');
    document.getElementById('sort-path').classList.toggle('active', s === 'path');
    render();
  }

  function onSearch() { render(); }

  function render() {
    if (currentView === 'folder') renderFolders();
    else renderAll();
  }

  /* ── Folder view ── */
  function renderFolders() {
    const q = (document.getElementById('search')?.value || '').toLowerCase().trim();
    let pages = allPages;
    if (q) pages = pages.filter(p => p.label.toLowerCase().includes(q) || p.path.toLowerCase().includes(q));

    const folders = {};
    const rootPages = [];
    for (const p of pages) {
      if (!p.folder) { rootPages.push(p); }
      else {
        if (!folders[p.folder]) folders[p.folder] = { name: p.folder, pages: [] };
        folders[p.folder].pages.push(p);
      }
    }
    const folderKeys = Object.keys(folders).sort();
    const total = pages.length;

    const count = document.getElementById('count');
    if (q) {
      count.textContent = `${total} result${total !== 1 ? 's' : ''} for "${q}"`;
    } else {
      const fc = folderKeys.length;
      count.textContent = `${fc} folder${fc !== 1 ? 's' : ''}` +
        (rootPages.length ? ` · ${rootPages.length} root file${rootPages.length !== 1 ? 's' : ''}` : '');
    }

    const content = document.getElementById('main-content');
    if (!total) {
      content.innerHTML = '<div class="folder-grid"><div class="state">Nothing matches that search. Try a shorter term.</div></div>';
      return;
    }

    let html = '';

    if (rootPages.length) {
      html += `<div class="root-section">
        <div class="root-label">Root</div>
        <div class="root-chips">`;
      for (const p of rootPages.sort((a,b) => a.label.localeCompare(b.label))) {
        html += `<a class="root-chip" href="${esc(p.url)}" target="_blank" rel="noopener">
          <span>${p.icon}</span><span>${esc(p.label)}</span>
        </a>`;
      }
      html += `</div></div>`;
    }

    html += `<div class="folder-grid">`;
    for (const key of folderKeys) {
      const fd = folders[key];
      const accent = hashColor(key);
      const topName = key.split('/').pop();
      const sorted = [...fd.pages].sort((a,b) => a.label.localeCompare(b.label));
      const autoOpen = !!q;

      html += `<div class="folder-card${autoOpen ? ' open' : ''}" style="--accent:${accent}" onclick="toggleFolder(this)">
        <div class="folder-card-head">
          <div class="folder-icon">${esc(monogram(topName))}</div>
          <div class="folder-label">
            <div class="folder-name">${esc(topName)}</div>
            <div class="folder-sub"><span class="cnt">${sorted.length} page${sorted.length !== 1 ? 's' : ''}</span>&ensp;·&ensp;${esc(key)}</div>
          </div>
          <span class="folder-arrow">›</span>
        </div>
        <div class="page-list">`;
      for (const p of sorted) {
        html += `<a class="page-item" href="${esc(p.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
          <span class="page-item-icon">${p.icon}</span>
          <span class="page-item-name">${esc(p.label)}</span>
          <span class="page-item-arrow">↗</span>
        </a>`;
      }
      html += `</div></div>`;
    }
    html += `</div>`;
    content.innerHTML = html;
  }

  function toggleFolder(el) { el.classList.toggle('open'); }

  /* ── All pages flat view ── */
  function renderAll() {
    const q = (document.getElementById('search')?.value || '').toLowerCase().trim();
    let pages = allPages.filter(p =>
      !q || p.label.toLowerCase().includes(q) || p.path.toLowerCase().includes(q)
    );
    if (sortMode === 'name') pages.sort((a,b) => a.label.localeCompare(b.label));
    else pages.sort((a,b) => a.path.localeCompare(b.path));

    const count = document.getElementById('count');
    count.textContent = q ? `${pages.length} of ${allPages.length} pages` : `${allPages.length} page${allPages.length !== 1 ? 's' : ''}`;

    const content = document.getElementById('main-content');
    if (!pages.length) {
      content.innerHTML = '<div class="flat-grid"><div class="state">Nothing matches that search. Try a shorter term.</div></div>';
      return;
    }
    content.innerHTML = `<div class="flat-grid">${pages.map(p => `
      <a class="flat-card" href="${esc(p.url)}" target="_blank" rel="noopener" style="--accent:${p.accent}">
        <div class="flat-body">
          <div class="flat-ico">${p.icon}</div>
          <div class="flat-info">
            <div class="flat-name">${esc(p.label)}</div>
            <div class="flat-path">${esc(p.path)}</div>
          </div>
        </div>
        <div class="flat-footer">
          <span class="badge">${esc(p.folder || 'root')}</span>
          <span class="go" style="font-size:13px">↗</span>
        </div>
      </a>`).join('')}</div>`;
  }

  loadPages();
</script>
</body>
</html>
