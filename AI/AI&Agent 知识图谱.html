<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI &amp; Agent 知识图谱</title>
<style>
:root{
  --bg:#06070c;--tx:#e8ecf6;--dm:#96a0b6;--ft:#6b7488;
  --bd:rgba(255,255,255,.09);
  --ac:#4fd1ff;--ac-rgb:79,209,255;
  --topbar-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  transition:--ac .4s;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 背景 ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#06070c}
.bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(1100px 560px at 12% -8%,rgba(var(--ac-rgb),.11),transparent 60%),
    radial-gradient(900px 500px at 94% 8%,rgba(var(--ac-rgb),.06),transparent 60%);
  transition:background .5s;
}
.bg::after{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 10%,transparent 76%);
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 10%,transparent 76%);
}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.26;transition:background .5s}
.b1{width:520px;height:520px;background:var(--ac);top:-190px;left:-130px;animation:f1 30s ease-in-out infinite}
.b2{width:440px;height:440px;background:var(--ac);bottom:-140px;right:-140px;opacity:.18;animation:f2 34s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,60px) scale(1.12)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-70px,-60px) scale(.9)}}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:150;
  height:var(--topbar-h);
  display:flex;align-items:center;gap:14px;
  padding:0 20px;
  background:rgba(6,7,12,.85);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.brand{
  display:flex;align-items:center;gap:10px;
  text-decoration:none;color:var(--tx);flex:0 0 auto;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-weight:800;font-size:12px;color:#04121c;
  background:linear-gradient(135deg,var(--ac),rgba(var(--ac-rgb),.55));
  box-shadow:0 0 22px -6px rgba(var(--ac-rgb),.85);
  transition:background .4s,box-shadow .4s;
}
.brand-txt{display:flex;flex-direction:column;line-height:1.2}
.brand-txt b{font-size:13.5px;letter-spacing:-.005em}
.brand-txt span{font-size:10px;color:var(--ft);letter-spacing:.1em}

.tabs{
  display:flex;gap:4px;flex:1;overflow-x:auto;
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
  padding:0 4px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;
  padding:7px 12px;border-radius:9px;
  font-size:12.5px;color:var(--dm);text-decoration:none;
  border:1px solid transparent;white-space:nowrap;
  transition:.2s;cursor:pointer;
}
.tab:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.tab.active{
  color:#fff;
  background:linear-gradient(135deg,rgba(var(--ac-rgb),.2),rgba(var(--ac-rgb),.04));
  border-color:rgba(var(--ac-rgb),.35);
}
.tab em{font-style:normal;font-size:13px;opacity:.85}

.search-wrap{
  position:relative;flex:0 0 220px;
}
.search-wrap input{
  width:100%;padding:8px 34px 8px 32px;
  border-radius:9px;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  color:var(--tx);font-size:12.5px;font-family:inherit;outline:none;
  transition:.2s;
}
.search-wrap input::placeholder{color:var(--ft)}
.search-wrap input:focus{
  border-color:rgba(var(--ac-rgb),.5);
  background:rgba(var(--ac-rgb),.07);
  box-shadow:0 0 0 3px rgba(var(--ac-rgb),.1);
}
.search-wrap svg{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--ft);pointer-events:none;
}
.search-kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-size:10px;padding:2px 6px;border-radius:4px;
  background:rgba(255,255,255,.07);color:var(--ft);
  border:1px solid rgba(255,255,255,.08);pointer-events:none;
}

/* ---------- 布局 ---------- */
.body{
  display:grid;grid-template-columns:240px minmax(0,1fr);
  max-width:1440px;margin:0 auto;
  min-height:calc(100vh - var(--topbar-h));
}
.sidebar{
  position:sticky;top:var(--topbar-h);
  height:calc(100vh - var(--topbar-h));
  display:flex;flex-direction:column;
  padding:18px 10px 12px;
  border-right:1px solid rgba(255,255,255,.06);
  background:rgba(8,10,18,.5);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow-y:auto;
}
.side-head{
  padding:0 10px 12px;margin-bottom:6px;
  border-bottom:1px solid rgba(255,255,255,.055);
}
.side-title{font-size:12.5px;font-weight:700;color:#fff;letter-spacing:-.005em}
.side-sub{font-size:10.5px;color:var(--ft);letter-spacing:.06em;margin-top:2px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.nav a{
  display:flex;align-items:center;gap:9px;
  padding:7px 11px;border-radius:9px;
  color:var(--dm);font-size:12.5px;text-decoration:none;
  border:1px solid transparent;transition:.18s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav a:hover{color:var(--tx);background:rgba(255,255,255,.055)}
.nav a.active{
  color:#fff;
  background:linear-gradient(90deg,rgba(var(--ac-rgb),.16),rgba(var(--ac-rgb),.02));
  border-color:rgba(var(--ac-rgb),.28);
}
.nav em{font-style:normal;font-size:12px;opacity:.8;flex:0 0 auto}
.nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.main{
  min-width:0;padding:0 44px 130px;
  max-width:1060px;width:100%;margin:0 auto;
}

/* ---------- 总览页 ---------- */
.overview-hero{padding:64px 0 40px}
.badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10.5px;font-weight:700;letter-spacing:.18em;
  color:var(--ac);padding:6px 13px;border-radius:999px;
  border:1px solid rgba(var(--ac-rgb),.32);
  background:rgba(var(--ac-rgb),.07);
  margin-bottom:20px;transition:.3s;
}
.badge::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--ac);box-shadow:0 0 10px var(--ac);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.overview-hero h1{
  font-size:clamp(32px,4.6vw,54px);
  line-height:1.08;letter-spacing:-.035em;font-weight:800;
  margin-bottom:16px;
}
.grad{
  background:linear-gradient(100deg,var(--ac),#fff 55%,var(--ac));
  background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 7s linear infinite;
}
@keyframes shimmer{to{background-position:220% center}}
.overview-hero p{
  font-size:15px;color:var(--dm);max-width:640px;line-height:1.8;
}
.overview-stats{
  display:flex;gap:36px;margin-top:34px;flex-wrap:wrap;
}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-num{
  font-size:26px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(135deg,#fff,#8fa5c8);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat-label{font-size:11px;color:var(--ft);letter-spacing:.1em;text-transform:uppercase}

/* ---------- 模块卡片网格 ---------- */
.modules{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;margin:36px 0 60px;
}
.mod{
  position:relative;overflow:hidden;
  padding:22px 22px 20px;border-radius:16px;
  background:linear-gradient(158deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--bd);
  text-decoration:none;color:inherit;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;
  cursor:pointer;
}
.mod::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(var(--mc-rgb,var(--ac-rgb)),.16),transparent 62%);
  opacity:0;transition:opacity .35s;
}
.mod:hover{
  transform:translateY(-4px);
  border-color:rgba(var(--mc-rgb,var(--ac-rgb)),.42);
  box-shadow:0 16px 48px -16px rgba(var(--mc-rgb,var(--ac-rgb)),.7);
}
.mod:hover::before{opacity:1}
.mod-icon{
  width:44px;height:44px;border-radius:13px;
  display:grid;place-items:center;font-size:22px;
  background:linear-gradient(150deg,rgba(var(--mc-rgb,var(--ac-rgb)),.22),rgba(255,255,255,.03));
  border:1px solid rgba(var(--mc-rgb,var(--ac-rgb)),.3);
  box-shadow:0 0 30px -14px var(--mc,var(--ac));
  margin-bottom:14px;
}
.mod-title{
  font-size:17px;font-weight:750;letter-spacing:-.015em;
  color:#fff;margin-bottom:6px;
}
.mod-sub{
  font-size:12.5px;color:var(--dm);line-height:1.65;
  margin-bottom:14px;min-height:40px;
}
.mod-meta{
  display:flex;gap:14px;font-size:11px;color:var(--ft);
  letter-spacing:.02em;
}
.mod-meta b{
  color:var(--mc,var(--ac));font-weight:700;
}

/* ---------- 模块页 ---------- */
.mod-hero{padding:56px 0 36px}
.mod-hero .badge{color:var(--ac);border-color:rgba(var(--ac-rgb),.32);background:rgba(var(--ac-rgb),.07)}
.mod-hero h1{
  font-size:clamp(28px,4vw,46px);
  line-height:1.1;letter-spacing:-.03em;font-weight:800;
  margin-bottom:14px;
}
.mod-hero p{
  font-size:14.5px;color:var(--dm);max-width:640px;line-height:1.8;
}
.mod-meta-row{
  display:flex;gap:20px;margin-top:22px;flex-wrap:wrap;
  font-size:12px;color:var(--ft);
}
.mod-meta-row b{color:var(--ac);font-weight:700}

/* ---------- Section ---------- */
.sec{
  padding:38px 0 14px;scroll-margin-top:calc(var(--topbar-h) + 20px);
  opacity:0;transform:translateY(22px);
  transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1);
}
.sec.in{opacity:1;transform:none}
.sec+.sec{border-top:1px solid rgba(255,255,255,.055)}
.sh{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px}
.si{
  width:44px;height:44px;flex:0 0 44px;border-radius:13px;
  display:grid;place-items:center;font-size:21px;
  background:linear-gradient(150deg,rgba(var(--ac-rgb),.2),rgba(255,255,255,.03));
  border:1px solid rgba(var(--ac-rgb),.3);
  box-shadow:0 0 30px -14px var(--ac);
}
.st{font-size:22px;font-weight:750;letter-spacing:-.02em;line-height:1.25}
.ss{font-size:12.5px;color:var(--ft);margin-top:4px}

.lead{font-size:14.5px;color:var(--dm);line-height:1.85;margin-bottom:18px}
.lead b{color:#fff;font-weight:650}

.sub{
  display:flex;align-items:center;gap:12px;
  margin:28px 0 13px;font-size:14px;font-weight:700;color:#fff;
}
.sub::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.15),transparent)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.card{
  position:relative;overflow:hidden;
  padding:16px 17px 15px;border-radius:14px;
  background:linear-gradient(158deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--bd);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s,box-shadow .28s;
}
.card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(var(--ac-rgb),.16),transparent 62%);
  opacity:0;transition:opacity .32s;
}
.card:hover{
  transform:translateY(-3px);
  border-color:rgba(var(--ac-rgb),.42);
  box-shadow:0 14px 44px -16px rgba(var(--ac-rgb),.7);
}
.card:hover::before{opacity:1}
.ct{
  font-size:14px;font-weight:680;color:#fff;
  position:relative;padding-left:11px;margin-bottom:7px;
}
.ct::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:4px;border-radius:50%;
  background:var(--ac);box-shadow:0 0 9px var(--ac);
}
.cd{font-size:13px;color:var(--dm);line-height:1.72;position:relative}
.cd b{color:#fff;font-weight:600}
.tag{
  font-size:10px;padding:2px 8px;border-radius:999px;
  color:var(--ac);background:rgba(var(--ac-rgb),.12);
  border:1px solid rgba(var(--ac-rgb),.28);
  font-weight:600;margin-left:6px;vertical-align:middle;
}

.steps{list-style:none;counter-reset:s;display:grid;gap:8px;margin:14px 0}
.steps li{
  counter-increment:s;position:relative;
  padding:11px 15px 11px 48px;border-radius:11px;
  background:rgba(255,255,255,.028);
  border:1px solid rgba(255,255,255,.06);
  font-size:13px;color:var(--dm);line-height:1.65;
  transition:.22s;
}
.steps li::before{
  content:counter(s,decimal-leading-zero);
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-family:ui-monospace,monospace;font-size:11px;font-weight:700;
  color:var(--ac);opacity:.9;
}
.steps li:hover{
  background:rgba(var(--ac-rgb),.07);
  border-color:rgba(var(--ac-rgb),.24);
  color:var(--tx);
}
.steps li b{color:#fff}

.check{list-style:none;display:grid;gap:7px;margin:16px 0}
.check li{
  position:relative;padding:10px 14px 10px 40px;
  border-radius:10px;background:rgba(255,255,255,.028);
  border:1px solid rgba(255,255,255,.06);
  font-size:13px;color:var(--dm);line-height:1.6;
  transition:.2s;
}
.check li::before{
  content:'✓';position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:12px;font-weight:800;color:var(--ac);opacity:.9;
}
.check li:hover{
  background:rgba(var(--ac-rgb),.07);
  border-color:rgba(var(--ac-rgb),.24);
  color:var(--tx);
}
.check li b{color:#fff}

.note{
  margin:18px 0;padding:14px 17px;border-radius:12px;
  font-size:13px;line-height:1.72;color:var(--dm);
  border-left:3px solid var(--ac);background:rgba(var(--ac-rgb),.06);
}
.note b{display:block;font-weight:700;color:#fff;margin-bottom:3px;font-size:13px}
.note.warn{border-left-color:#fbbf24;background:rgba(251,191,36,.07)}
.note.lime{border-left-color:#7dd3a0;background:rgba(125,211,160,.06)}
.note.cyan{border-left-color:#4fd1ff;background:rgba(79,209,255,.06)}

.tbl{
  margin:16px 0;border-radius:13px;overflow:hidden;
  border:1px solid var(--bd);background:rgba(255,255,255,.018);
  overflow-x:auto;
}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:520px}
th{
  text-align:left;padding:11px 15px;
  font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ft);background:rgba(255,255,255,.032);
  border-bottom:1px solid var(--bd);white-space:nowrap;
}
td{
  padding:12px 15px;border-bottom:1px solid rgba(255,255,255,.045);
  color:var(--dm);vertical-align:top;line-height:1.65;
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(var(--ac-rgb),.055)}
td:first-child{color:#fff;font-weight:620;white-space:nowrap}

.code{
  margin:18px 0;padding:18px 20px;border-radius:13px;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.085);
  overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12.4px;line-height:1.85;color:#bfd0ea;
  position:relative;
}
.code::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--ac),transparent);
}
.code .c{color:#5b667e;font-style:italic}

.formula{
  position:relative;overflow:hidden;
  margin:20px 0;padding:18px 22px;border-radius:14px;
  background:linear-gradient(120deg,rgba(var(--ac-rgb),.14),rgba(var(--ac-rgb),.028));
  border:1px solid rgba(var(--ac-rgb),.28);
}
.formula::after{
  content:'';position:absolute;top:0;left:-100%;width:55%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
  animation:sweep 5s ease-in-out infinite;
}
@keyframes sweep{0%{left:-100%}55%,100%{left:170%}}
.fl{font-size:10px;font-weight:800;letter-spacing:.2em;color:var(--ac);text-transform:uppercase}
.fb{
  margin-top:8px;font-size:clamp(13px,1.6vw,16px);
  font-weight:680;color:#fff;line-height:1.6;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

.risk{display:grid;gap:10px;margin:16px 0}
.risk-item{
  padding:14px 16px;border-radius:12px;
  background:rgba(251,191,36,.055);
  border:1px solid rgba(251,191,36,.22);
  border-left:3px solid #fbbf24;
}
.risk-item b{display:block;font-size:13.5px;color:#fff;margin-bottom:4px}
.risk-item p{font-size:12.8px;color:var(--dm);line-height:1.65}
.risk-item em{font-style:normal;color:#fbbf24;font-weight:600}

/* ---------- 搜索结果 ---------- */
.search-results{padding:44px 0 60px}
.search-results h2{
  font-size:20px;font-weight:750;letter-spacing:-.02em;margin-bottom:6px;
}
.search-results .hint{font-size:12.5px;color:var(--ft);margin-bottom:24px}
.sr-list{display:grid;gap:8px}
.sr-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 16px;border-radius:12px;
  background:rgba(255,255,255,.028);
  border:1px solid rgba(255,255,255,.06);
  text-decoration:none;color:inherit;
  transition:.2s;
}
.sr-item:hover{
  background:rgba(var(--ac-rgb),.07);
  border-color:rgba(var(--ac-rgb),.28);
  transform:translateX(3px);
}
.sr-icon{font-size:18px;flex:0 0 auto;opacity:.85}
.sr-body{flex:1;min-width:0}
.sr-title{font-size:13.5px;color:#fff;font-weight:650;margin-bottom:2px}
.sr-title mark{background:rgba(var(--ac-rgb),.28);color:#fff;padding:0 3px;border-radius:3px}
.sr-path{font-size:11.5px;color:var(--ft);margin-bottom:5px}
.sr-excerpt{
  font-size:12.5px;color:var(--dm);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.sr-excerpt mark{background:rgba(var(--ac-rgb),.28);color:#fff;padding:0 2px;border-radius:3px}

.empty-state{
  text-align:center;padding:70px 20px;color:var(--ft);font-size:14px;
}
.empty-state strong{display:block;font-size:17px;color:var(--dm);margin-bottom:8px}

/* ---------- 回顶 ---------- */
.toTop{
  position:fixed;right:24px;bottom:24px;
  width:42px;height:42px;border-radius:50%;
  background:rgba(18,22,34,.85);
  border:1px solid rgba(255,255,255,.12);
  color:var(--dm);cursor:pointer;font-size:15px;
  backdrop-filter:blur(10px);z-index:80;
  opacity:0;pointer-events:none;transition:.25s;
}
.toTop.show{opacity:1;pointer-events:auto}
.toTop:hover{
  color:#fff;border-color:rgba(var(--ac-rgb),.55);
  box-shadow:0 0 26px -6px rgba(var(--ac-rgb),.8);
  transform:translateY(-2px);
}

/* ---------- 进度条 ---------- */

function hexToRgb(hex){
  const h = hex.replace('#','');
  return [
    parseInt(h.slice(0,2),16),
    parseInt(h.slice(2,4),16),
    parseInt(h.slice(4,6),16)
  ].join(',');
}
function setAccent(name){

/* =========================================================
   工具
   ========================================================= */
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function escCode(s){
  return String(s)
    .replace(/<span class="c">/g, '\x01')
    .replace(/<\/span>/g, '\x02')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\x01/g, '<span class="c">')
    .replace(/\x02/g, '</span>');
}

/* 统计 */
function moduleStats(mod){
  let sections = mod.sections.length;
  let cards = 0;
  mod.sections.forEach(sec => {
    sec.blocks.forEach(b => {
      if (b.type === 'cards') cards += b.items.length;
    });
  });
  return { sections, cards };
}

/* 卡片 */
function cardHTML(i){
  return '<div class="card">'
    + '<div class="ct">' + i.t + (i.tag ? '<span class="tag">' + esc(i.tag) + '</span>' : '') + '</div>'
    + '<p class="cd">' + i.d + '</p>'
    + '</div>';
}

/* block 渲染 */
function renderBlock(b){
  switch(b.type){
    case 'lead':
      return '<p class="lead">' + b.text + '</p>';
    case 'sub':
      return '<h3 class="sub">' + b.text + '</h3>';
    case 'cards':
      return '<div class="cards">' + b.items.map(cardHTML).join('') + '</div>';
    case 'code':
      return '<pre class="code"><code>' + escCode(b.text) + '</code></pre>';
    case 'steps':
      return '<ul class="steps">' + b.items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
    case 'check':
      return '<ul class="check">' + b.items.map(i => '<li>' + i + '</li>').join('') + '</ul>';
    case 'note':
      return '<div class="note ' + (b.warn ? 'warn' : b.lime ? 'lime' : b.cyan ? 'cyan' : '') + '">'
        + (b.title ? '<b>' + b.title + '</b>' : '')
        + b.text + '</div>';
    case 'tbl':
      return '<div class="tbl"><table>'
        + '<thead><tr>' + b.head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead>'
        + '<tbody>' + b.rows.map(r =>
            '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>'
          ).join('') + '</tbody>'
        + '</table></div>';
    case 'formula':
      return '<div class="formula">'
        + (b.label ? '<div class="fl">' + b.label + '</div>' : '')
        + '<div class="fb">' + b.text + '</div>'
        + '</div>';
    case 'risk':
      return '<div class="risk">' + b.items.map(r =>
        '<div class="risk-item"><b>' + r.t + '</b><p>' + r.d + ' <em>' + r.e + '</em></p></div>'
      ).join('') + '</div>';
    default:
      return '';
  }
}

/* =========================================================
   DOM
   ========================================================= */
const tabsEl    = document.getElementById('tabs');
const sidebarEl = document.getElementById('sidebar');
const navEl     = document.getElementById('nav');
const mainEl    = document.getElementById('main');
const sideTitle = document.getElementById('sideTitle');
const sideSub   = document.getElementById('sideSub');
const progEl    = document.getElementById('prog');
const toTopBtn  = document.getElementById('toTop');
const qInput    = document.getElementById('q');

/* 顶栏 Tabs */
const homeTab = document.createElement('a');
homeTab.className = 'tab';
homeTab.href = '#/';
homeTab.dataset.id = '__home';
homeTab.innerHTML = '<em>🏠</em>总览';
tabsEl.appendChild(homeTab);

MODULES.forEach(m => {
  const a = document.createElement('a');
  a.className = 'tab';
  a.href = '#/' + m.id;
  a.dataset.id = m.id;
  a.innerHTML = '<em>' + m.icon + '</em>' + m.title;
  tabsEl.appendChild(a);
});

/* =========================================================
   总览页
   ========================================================= */
function renderOverview(){
  setAccent('cyan');
  sideTitle.textContent = '总览';
  sideSub.textContent = 'OVERVIEW';
  navEl.innerHTML = '';

  let totalSections = 0, totalCards = 0;
  MODULES.forEach(m => {
    const s = moduleStats(m);
    totalSections += s.sections;
    totalCards += s.cards;
  });

  let html = '<div class="overview-hero">'
    + '<div class="badge">KNOWLEDGE MAP</div>'
    + '<h1>AI &amp; Agent<br><span class="grad">知识图谱</span></h1>'
    + '<p>六个模块，从最基础的概念到生产落地的评估与安全。每个模块可以独立阅读，也可以按顺序自上而下走一遍，建立完整的知识体系。</p>'
    + '<div class="overview-stats">'
    +   '<div class="stat"><span class="stat-num">' + MODULES.length + '</span><span class="stat-label">模块</span></div>'
    +   '<div class="stat"><span class="stat-num">' + totalSections + '</span><span class="stat-label">章节</span></div>'
    +   '<div class="stat"><span class="stat-num">' + totalCards + '</span><span class="stat-label">概念卡片</span></div>'
    + '</div>'
    + '</div>'
    + '<div class="modules">';

  MODULES.forEach(m => {
    const acc = ACCENTS[m.accent] || ACCENTS.cyan;
    const accRgb = hexToRgb(acc);
    const s = moduleStats(m);
    html += '<a class="mod" href="#/' + m.id + '" '
      + 'style="--mc:' + acc + ';--mc-rgb:' + accRgb + '" '
      + 'data-accent="' + m.accent + '">'
      + '<div class="mod-icon">' + m.icon + '</div>'
      + '<div class="mod-title">' + m.title + '</div>'
      + '<div class="mod-sub">' + m.desc + '</div>'
      + '<div class="mod-meta">'
      +   '<span><b>' + s.sections + '</b> 章节</span>'
      +   '<span><b>' + s.cards + '</b> 概念</span>'
      + '</div>'
      + '</a>';
  });
  html += '</div>';

  mainEl.innerHTML = html;

  /* 卡片光晕 */
  mainEl.querySelectorAll('.mod').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
}

/* =========================================================
   模块页
   ========================================================= */
let currentObs = null;

function renderModule(modId, sectionId){
  const mod = MODULES.find(m => m.id === modId);
  if (!mod){ renderOverview(); return; }

  setAccent(mod.accent);
  sideTitle.textContent = mod.title;
  sideSub.textContent = mod.title.toUpperCase();
  navEl.innerHTML = '';

  /* 侧栏导航 */
  mod.sections.forEach(sec => {
    const a = document.createElement('a');
    a.href = '#/' + mod.id + '/' + sec.id;
    a.dataset.id = sec.id;
    a.innerHTML = '<em>' + sec.icon + '</em><span>' + sec.t + '</span>';
    if (sec.id === sectionId) a.classList.add('active');
    navEl.appendChild(a);
  });

  /* 内容 */
  const stats = moduleStats(mod);
  let html = '<div class="mod-hero">'
    + '<div class="badge">MODULE · ' + mod.title.toUpperCase() + '</div>'
    + '<h1>' + mod.title + '</h1>'
    + '<p>' + mod.desc + '</p>'
    + '<div class="mod-meta-row">'
    +   '<span><b>' + stats.sections + '</b> 章节</span>'
    +   '<span><b>' + stats.cards + '</b> 概念卡片</span>'
    + '</div>'
    + '</div>';

  mod.sections.forEach(sec => {
    html += '<section class="sec" id="' + sec.id + '">'
      + '<div class="sh">'
      +   '<div class="si">' + sec.icon + '</div>'
      +   '<div><h2 class="st">' + sec.t + '</h2><p class="ss">' + sec.s + '</p></div>'
      + '</div>'
      + '<div class="sb">' + sec.blocks.map(renderBlock).join('') + '</div>'
      + '</section>';
  });

  mainEl.innerHTML = html;

  /* 卡片光晕 */
  mainEl.querySelectorAll('.card').forEach(c => {
    /* 光晕交给全局 mousemove 处理 */
  });

  /* 滚动出现 */
  if (currentObs) currentObs.disconnect();
  currentObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting){
        e.target.classList.add('in');
        currentObs.unobserve(e.target);
      }
    });
  }, { rootMargin: '0px 0px -70px 0px' });
  mainEl.querySelectorAll('.sec').forEach(s => currentObs.observe(s));

  /* 滚动到指定 section */
  if (sectionId){
    const target = document.getElementById(sectionId);
    if (target){
      /* 等渲染完再滚动 */
      requestAnimationFrame(() => {
        const top = target.offsetTop - 80;
        window.scrollTo({ top, behavior: 'auto' });
      });
    }
  } else {
    window.scrollTo({ top: 0, behavior: 'auto' });
  }
}

/* =========================================================
   搜索
   ========================================================= */
function renderSearch(keyword){
  setAccent('cyan');
  sideTitle.textContent = '搜索';
  sideSub.textContent = 'SEARCH';
  navEl.innerHTML = '';

  const kw = keyword.toLowerCase();
  const results = [];

  MODULES.forEach(m => {
    m.sections.forEach(sec => {
      const secText = (sec.t + ' ' + sec.s + ' ' + sec.blocks.map(b => JSON.stringify(b)).join(' ')).toLowerCase();
      const titleHit = sec.t.toLowerCase().includes(kw);
      const textHit = secText.includes(kw);
      if (titleHit || textHit){
        results.push({
          modId: m.id,
          modTitle: m.title,
          modIcon: m.icon,
          secId: sec.id,
          secTitle: sec.t,
          secSub: sec.s,
          excerpt: buildExcerpt(secText, kw),
          titleHit
        });
      }
    });
  });

  let html = '<div class="search-results">'
    + '<h2>搜索结果</h2>'
    + '<p class="hint">关键词「' + esc(keyword) + '」 · 命中 <b style="color:var(--ac)">' + results.length + '</b> 个章节</p>';

  if (!results.length){
    html += '<div class="empty-state"><strong>没有找到相关概念</strong>试试更短的关键词，比如「token」「记忆」「工具」「注入」</div>';
  } else {
    html += '<div class="sr-list">';
    results.forEach(r => {
      html += '<a class="sr-item" href="#/' + r.modId + '/' + r.secId + '">'
        + '<div class="sr-icon">' + r.modIcon + '</div>'
        + '<div class="sr-body">'
        +   '<div class="sr-title">' + highlight(r.secTitle, kw) + '</div>'
        +   '<div class="sr-path">' + r.modTitle + ' · ' + r.secSub + '</div>'
        +   (r.excerpt ? '<div class="sr-excerpt">' + r.excerpt + '</div>' : '')
        + '</div>'
        + '</a>';
    });
    html += '</div>';
  }
  html += '</div>';

  mainEl.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function buildExcerpt(text, kw){
  const idx = text.toLowerCase().indexOf(kw);
  if (idx < 0) return '';
  const start = Math.max(0, idx - 40);
  const end = Math.min(text.length, idx + 80);
  let excerpt = (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
  /* 简单清理 JSON 符号 */
  excerpt = excerpt.replace(/[{}\[\]"]/g, ' ').replace(/\s+/g, ' ');
  return highlight(excerpt, kw);
}
function highlight(text, kw){
  const safe = esc(text);
  if (!kw) return safe;
  const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}

/* =========================================================
   路由
   ========================================================= */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return { view:'overview' };
  const parts = h.split('/');
  if (parts[0] === 'search'){
    return { view:'search', keyword: decodeURIComponent(parts.slice(1).join('/') || '') };
  }
  if (parts.length === 1) return { view:'module', modId:parts[0] };
  return { view:'module', modId:parts[0], secId:parts[1] };
}

function applyRoute(){
  const route = parseHash();

  /* Tab 高亮 */
  const activeId = route.view === 'module' ? route.modId : (route.view === 'search' ? null : '__home');
  tabsEl.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.id === activeId);
  });

  if (route.view === 'overview'){
    renderOverview();
  } else if (route.view === 'search'){
    renderSearch(route.keyword);
  } else if (route.view === 'module'){
    renderModule(route.modId, route.secId);
  }
  updateProgress();
}

window.addEventListener('hashchange', applyRoute);

/* =========================================================
   全局 mousemove（卡片光晕）
   ========================================================= */
document.addEventListener('mousemove', e => {
  const c = e.target.closest ? e.target.closest('.card') : null;
  if (c){
    const r = c.getBoundingClientRect();
    c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    c.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }
}, { passive:true });

/* =========================================================
   滚动进度 / 回顶 / 侧栏高亮
   ========================================================= */
let tick = false;
function updateProgress(){
  const y = scrollY;
  const h = document.documentElement.scrollHeight - innerHeight;
  progEl.style.width = (h > 0 ? Math.min(y / h * 100, 100) : 0) + '%';
  toTopBtn.classList.toggle('show', y > 600);
}
function updateSidebarActive(){
  const route = parseHash();
  if (route.view !== 'module') return;
  const y = scrollY;
  let cur = null;
  mainEl.querySelectorAll('.sec').forEach(s => {
    if (s.offsetTop <= y + 160) cur = s.id;
  });
  navEl.querySelectorAll('a').forEach(a => {
    a.classList.toggle('active', a.dataset.id === cur);
  });
}
function onScroll(){
  updateProgress();
  updateSidebarActive();
  tick = false;
}
addEventListener('scroll', () => {
  if (!tick){ tick = true; requestAnimationFrame(onScroll); }
}, { passive:true });

toTopBtn.onclick = () => scrollTo({ top:0, behavior:'smooth' });

/* =========================================================
   搜索输入
   ========================================================= */
let searchTimer = null;
qInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const v = qInput.value.trim();
    if (!v){
      if (parseHash().view === 'search') location.hash = '#/';
      return;
    }
    location.hash = '#/search/' + encodeURIComponent(v);
  }, 220);
});

/* 快捷键 */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qInput){
    e.preventDefault();
    qInput.focus();
    qInput.select();
  }
  if (e.key === 'Escape' && document.activeElement === qInput){
    qInput.value = '';
    if (parseHash().view === 'search') location.hash = '#/';
    qInput.blur();
  }
});

/* =========================================================
   启动
   ========================================================= */
if (!location.hash) location.hash = '#/';
applyRoute();
</script>
